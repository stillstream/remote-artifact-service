[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-artifact-service"
version = "0.1.0"
description = "Read-only HTTP artifact browser for remote embedded Linux devices"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
artifact-service = "artifact_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
